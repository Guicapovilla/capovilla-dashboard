<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capovilla Dashboard — MVP</title>
  <style>
    /* CSS mínimo só pra não ficar ilegível — design vem depois */
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 1200px; margin: 2rem auto; padding: 0 1rem; background: #0f0f14; color: #e6e6ea; }
    h1, h2 { color: #fff; }
    h1 { border-bottom: 2px solid #333; padding-bottom: .5rem; }
    h2 { margin-top: 2.5rem; }
    .card { background: #1a1a22; border: 1px solid #2a2a35; border-radius: 8px; padding: 1rem; margin: .5rem 0; }
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; }
    .kpi { background: #1a1a22; border: 1px solid #2a2a35; border-radius: 8px; padding: 1rem; }
    .kpi .valor { font-size: 1.8rem; font-weight: bold; color: #4ade80; }
    .kpi .label { font-size: .85rem; color: #888; text-transform: uppercase; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { padding: .5rem .75rem; text-align: left; border-bottom: 1px solid #2a2a35; }
    th { color: #888; font-weight: normal; font-size: .85rem; text-transform: uppercase; }
    td { color: #e6e6ea; }
    .loading { color: #888; font-style: italic; }
    .erro { color: #f87171; background: #2a1515; padding: .5rem 1rem; border-radius: 4px; border: 1px solid #552222; }
    nav { margin-bottom: 2rem; }
    nav a { color: #60a5fa; margin-right: 1rem; text-decoration: none; }
    nav a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">📊 Resumo</a>
    <a href="sugestoes.html">💡 Sugestões</a>
    <a href="cronograma.html">📅 Cronograma</a>
    <a href="configuracoes.html">⚙️ Configurações</a>
  </nav>

  <h1>📊 Resumo do canal</h1>

  <h2>Metas do trimestre</h2>
  <div id="metas" class="kpi-grid">
    <div class="loading">Carregando metas…</div>
  </div>

  <h2>Top 5 vídeos por receita</h2>
  <div id="top-videos" class="card">
    <div class="loading">Carregando vídeos…</div>
  </div>

  <h2>Distribuição por console</h2>
  <div id="por-console" class="card">
    <div class="loading">Carregando distribuição…</div>
  </div>

  <h2>Últimos vídeos publicados</h2>
  <div id="ultimos" class="card">
    <div class="loading">Carregando últimos vídeos…</div>
  </div>

  <!-- Supabase JS client via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // ==========================================================
    // CONFIG — troca pelos valores reais
    // ==========================================================
    const SUPABASE_URL = 'https://ryspohcflrxjwwghvvqc.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_OzoD3gbIn4GoJ6szjwdkhw_KFGAGNsh';

    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ==========================================================
    // Utils
    // ==========================================================
    const BRL = v => (v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    const NUM = v => (v || 0).toLocaleString('pt-BR');
    const erro = (sel, msg) => document.querySelector(sel).innerHTML = `<div class="erro">❌ ${msg}</div>`;

    // ==========================================================
    // Metas do Q2
    // ==========================================================
    async function carregarMetas() {
      const { data, error } = await db
        .from('metas')
        .select('*')
        .eq('quarter', '2026-Q2');

      if (error) return erro('#metas', error.message);
      if (!data || data.length === 0) {
        document.getElementById('metas').innerHTML = '<div class="loading">Nenhuma meta cadastrada pro Q2.</div>';
        return;
      }

      const html = data.map(m => {
        const pct = m.valor_alvo > 0 ? Math.round((m.valor_atual / m.valor_alvo) * 100) : 0;
        const valorFmt = m.metrica === 'receita' ? BRL(m.valor_atual) : NUM(m.valor_atual);
        const alvoFmt  = m.metrica === 'receita' ? BRL(m.valor_alvo)  : NUM(m.valor_alvo);
        return `
          <div class="kpi">
            <div class="label">${m.metrica}</div>
            <div class="valor">${valorFmt}</div>
            <div style="color:#888;font-size:.85rem;margin-top:.25rem;">
              de ${alvoFmt} (${pct}%)
            </div>
          </div>
        `;
      }).join('');
      document.getElementById('metas').innerHTML = html;
    }

    // ==========================================================
    // Top 5 vídeos por receita (última coleta)
    // ==========================================================
    async function carregarTopVideos() {
      // Pega a data mais recente da tabela de métricas
      const { data: ultimaColeta, error: e1 } = await db
        .from('videos_metricas')
        .select('data_coleta')
        .order('data_coleta', { ascending: false })
        .limit(1);

      if (e1) return erro('#top-videos', e1.message);
      if (!ultimaColeta || ultimaColeta.length === 0) {
        document.getElementById('top-videos').innerHTML = '<div class="loading">Nenhuma métrica coletada ainda. Rode o Action.</div>';
        return;
      }

      const dataColeta = ultimaColeta[0].data_coleta;

      // Métricas dessa data
      const { data: metricas, error: e2 } = await db
        .from('videos_metricas')
        .select('video_id, views, rpm, receita_estimada')
        .eq('data_coleta', dataColeta)
        .order('receita_estimada', { ascending: false })
        .limit(5);

      if (e2) return erro('#top-videos', e2.message);

      const ids = metricas.map(m => m.video_id);
      const { data: videos, error: e3 } = await db
        .from('videos')
        .select('video_id, titulo, console')
        .in('video_id', ids);

      if (e3) return erro('#top-videos', e3.message);

      const videoMap = Object.fromEntries(videos.map(v => [v.video_id, v]));
      const rows = metricas.map(m => {
        const v = videoMap[m.video_id] || { titulo: '(sem título)', console: '?' };
        return `
          <tr>
            <td>${v.titulo}</td>
            <td>${v.console}</td>
            <td>${NUM(m.views)}</td>
            <td>${BRL(m.rpm)}</td>
            <td>${BRL(m.receita_estimada)}</td>
          </tr>
        `;
      }).join('');

      document.getElementById('top-videos').innerHTML = `
        <div style="font-size:.85rem;color:#888;margin-bottom:.5rem;">Coleta: ${dataColeta}</div>
        <table>
          <thead><tr><th>Título</th><th>Console</th><th>Views</th><th>RPM</th><th>Receita</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    // ==========================================================
    // Distribuição por console
    // ==========================================================
    async function carregarPorConsole() {
      const { data, error } = await db
        .from('videos')
        .select('console');

      if (error) return erro('#por-console', error.message);

      const contagem = {};
      data.forEach(v => {
        const c = v.console || 'geral';
        contagem[c] = (contagem[c] || 0) + 1;
      });

      const total = data.length;
      const rows = Object.entries(contagem)
        .sort((a, b) => b[1] - a[1])
        .map(([c, n]) => {
          const pct = Math.round((n / total) * 100);
          return `<tr><td>${c}</td><td>${n}</td><td>${pct}%</td></tr>`;
        }).join('');

      document.getElementById('por-console').innerHTML = `
        <table>
          <thead><tr><th>Console</th><th>Vídeos</th><th>%</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    // ==========================================================
    // Últimos 10 vídeos publicados
    // ==========================================================
    async function carregarUltimos() {
      const { data, error } = await db
        .from('videos')
        .select('video_id, titulo, console, data_publicacao, slug_sugestao_id')
        .order('data_publicacao', { ascending: false })
        .limit(10);

      if (error) return erro('#ultimos', error.message);

      const rows = data.map(v => {
        const dt = v.data_publicacao ? new Date(v.data_publicacao).toLocaleDateString('pt-BR') : '—';
        const slug = v.slug_sugestao_id ? '✓' : '';
        return `
          <tr>
            <td>${dt}</td>
            <td>${v.titulo}</td>
            <td>${v.console}</td>
            <td>${slug}</td>
          </tr>
        `;
      }).join('');

      document.getElementById('ultimos').innerHTML = `
        <table>
          <thead><tr><th>Publicado</th><th>Título</th><th>Console</th><th>Vinculado?</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    // ==========================================================
    // Boot
    // ==========================================================
    carregarMetas();
    carregarTopVideos();
    carregarPorConsole();
    carregarUltimos();
  </script>
</body>
</html>
