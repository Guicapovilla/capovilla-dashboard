<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sugestões — Capovilla Dashboard</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 1200px; margin: 2rem auto; padding: 0 1rem; background: #0f0f14; color: #e6e6ea; }
    h1, h2 { color: #fff; }
    h1 { border-bottom: 2px solid #333; padding-bottom: .5rem; }
    nav { margin-bottom: 2rem; }
    nav a { color: #60a5fa; margin-right: 1rem; text-decoration: none; }
    nav a:hover { text-decoration: underline; }

    .sug-card { background: #1a1a22; border: 1px solid #2a2a35; border-radius: 8px; padding: 1.25rem; margin: 1rem 0; }
    .sug-header { display: flex; justify-content: space-between; align-items: start; gap: 1rem; margin-bottom: .75rem; }
    .sug-titulo { font-size: 1.15rem; font-weight: 600; color: #fff; flex: 1; }
    .sug-legacy { font-size: .75rem; color: #666; font-family: monospace; }

    .status-badge { font-size: .75rem; padding: .25rem .6rem; border-radius: 999px; text-transform: uppercase; letter-spacing: .5px; }
    .status-gerada       { background: #1e3a5f; color: #93c5fd; }
    .status-aprovada     { background: #1e4f2c; color: #86efac; }
    .status-em_producao  { background: #5c3a0a; color: #fcd34d; }
    .status-publicada    { background: #3d1e5f; color: #c4b5fd; }
    .status-rejeitada    { background: #5c1e1e; color: #fca5a5; }

    .sug-motivo { color: #b8b8c2; font-size: .9rem; line-height: 1.5; max-height: 4.5rem; overflow: hidden; position: relative; margin: .5rem 0; }
    .sug-motivo.expanded { max-height: none; }
    .expand-btn { background: none; border: none; color: #60a5fa; cursor: pointer; font-size: .85rem; padding: 0; margin-top: .25rem; }

    .sug-actions { display: flex; gap: .5rem; margin-top: .75rem; flex-wrap: wrap; }
    button.action { background: #2a2a35; color: #e6e6ea; border: 1px solid #3a3a45; padding: .4rem .8rem; border-radius: 4px; cursor: pointer; font-size: .85rem; }
    button.action:hover { background: #3a3a45; }
    button.primary { background: #2563eb; border-color: #2563eb; color: white; }
    button.primary:hover { background: #1d4ed8; }
    button.danger { background: transparent; border-color: #7f1d1d; color: #fca5a5; }
    button.danger:hover { background: #3d0a0a; }

    .filter-bar { display: flex; gap: .5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .filter-bar button { background: #1a1a22; color: #888; border: 1px solid #2a2a35; padding: .4rem .8rem; border-radius: 4px; cursor: pointer; font-size: .85rem; }
    .filter-bar button.active { background: #2563eb; color: white; border-color: #2563eb; }

    .editor-modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.8); z-index: 100; align-items: center; justify-content: center; }
    .editor-modal-bg.show { display: flex; }
    .editor-modal { background: #1a1a22; border: 1px solid #2a2a35; border-radius: 8px; padding: 1.5rem; max-width: 800px; width: 90%; max-height: 85vh; overflow-y: auto; }
    .editor-modal h3 { margin-top: 0; color: #fff; }
    .editor-modal label { display: block; font-size: .85rem; color: #888; margin-top: .75rem; margin-bottom: .25rem; text-transform: uppercase; }
    .editor-modal input, .editor-modal textarea, .editor-modal select { width: 100%; background: #0f0f14; color: #e6e6ea; border: 1px solid #2a2a35; border-radius: 4px; padding: .5rem; font-family: inherit; font-size: .95rem; box-sizing: border-box; }
    .editor-modal textarea { min-height: 120px; resize: vertical; }
    .editor-modal .btn-row { display: flex; gap: .5rem; justify-content: flex-end; margin-top: 1.5rem; }

    .loading { color: #888; font-style: italic; }
    .erro { color: #f87171; background: #2a1515; padding: .5rem 1rem; border-radius: 4px; border: 1px solid #552222; }
    .empty { color: #888; text-align: center; padding: 2rem; font-style: italic; }

    .thumb { width: 120px; height: 68px; background: #2a2a35; border-radius: 4px; object-fit: cover; flex-shrink: 0; }
    .sug-row { display: flex; gap: 1rem; align-items: start; }
    .sug-body { flex: 1; min-width: 0; }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">📊 Resumo</a>
    <a href="sugestoes.html">💡 Sugestões</a>
    <a href="cronograma.html">📅 Cronograma</a>
    <a href="configuracoes.html">⚙️ Configurações</a>
  </nav>

  <h1>💡 Sugestões da semana</h1>

  <div class="filter-bar" id="filter-bar">
    <button data-filter="todos" class="active">Todos</button>
    <button data-filter="gerada">Gerada</button>
    <button data-filter="aprovada">Aprovada</button>
    <button data-filter="em_producao">Em produção</button>
    <button data-filter="publicada">Publicada</button>
    <button data-filter="rejeitada">Rejeitada</button>
  </div>

  <div id="lista">
    <div class="loading">Carregando sugestões…</div>
  </div>

  <!-- Modal de edição -->
  <div class="editor-modal-bg" id="modal">
    <div class="editor-modal">
      <h3>Editar sugestão</h3>
      <input type="hidden" id="edit-id">

      <label>Título sugerido</label>
      <input type="text" id="edit-titulo">

      <label>Tema / Conceito</label>
      <input type="text" id="edit-tema">

      <label>Status</label>
      <select id="edit-status">
        <option value="gerada">Gerada</option>
        <option value="aprovada">Aprovada</option>
        <option value="em_producao">Em produção</option>
        <option value="publicada">Publicada</option>
        <option value="rejeitada">Rejeitada</option>
      </select>

      <label>Data de publicação prevista</label>
      <input type="date" id="edit-data">

      <label>Motivo / Raciocínio</label>
      <textarea id="edit-motivo"></textarea>

      <label>Script</label>
      <textarea id="edit-script" style="min-height: 200px;"></textarea>

      <div class="btn-row">
        <button class="action" onclick="fecharModal()">Cancelar</button>
        <button class="action primary" onclick="salvarEdicao()">Salvar</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ============================================
    // CONFIG - cole a MESMA anon/publishable key que usou no index.html
    // ============================================
    const SUPABASE_URL = 'https://ryspohcflrxjwwghvvqc.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_OzoD3gbIn4GoJ6szjwdkhw_KFGAGNsh';

    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let cachesugestoes = [];
    let filtroAtivo = 'todos';

    // ============================================
    // Utilitários
    // ============================================
    const fmtData = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('pt-BR') : '—';
    const escapeHtml = s => (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    // ============================================
    // Carregar lista
    // ============================================
    async function carregar() {
      const { data, error } = await db
        .from('sugestoes')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        document.getElementById('lista').innerHTML = `<div class="erro">❌ ${error.message}</div>`;
        return;
      }
      cachesugestoes = data || [];
      renderizar();
    }

    function renderizar() {
      const lista = document.getElementById('lista');
      const filtradas = filtroAtivo === 'todos'
        ? cachesugestoes
        : cachesugestoes.filter(s => s.status === filtroAtivo);

      if (filtradas.length === 0) {
        lista.innerHTML = '<div class="empty">Nenhuma sugestão nesse filtro.</div>';
        return;
      }

      lista.innerHTML = filtradas.map(s => `
        <div class="sug-card" data-id="${s.id}">
          <div class="sug-row">
            <div class="sug-body">
              <div class="sug-header">
                <div>
                  <div class="sug-titulo">${escapeHtml(s.titulo_sugerido || s.tema || 'Sem título')}</div>
                  <div class="sug-legacy">${escapeHtml(s.legacy_id || s.id.substring(0,8))} · ${fmtData(s.data_publicacao_prevista)}</div>
                </div>
                <span class="status-badge status-${s.status}">${s.status}</span>
              </div>
              <div class="sug-motivo" id="motivo-${s.id}">
                ${escapeHtml(s.motivo || 'Sem raciocínio registrado.')}
              </div>
              ${(s.motivo || '').length > 200
                ? `<button class="expand-btn" onclick="toggleMotivo('${s.id}')">Ver completo ▾</button>`
                : ''}
              <div class="sug-actions">
                <button class="action" onclick="abrirEditor('${s.id}')">✏️ Editar</button>
                <button class="action" onclick="mudarStatus('${s.id}', 'aprovada')">✓ Aprovar</button>
                <button class="action" onclick="mudarStatus('${s.id}', 'em_producao')">🎬 Em produção</button>
                <button class="action danger" onclick="mudarStatus('${s.id}', 'rejeitada')">✕ Rejeitar</button>
                <button class="action primary" onclick="gerarScript('${s.id}')">🧠 Gerar script</button>
              </div>
            </div>
          </div>
        </div>
      `).join('');
    }

    function toggleMotivo(id) {
      document.getElementById('motivo-' + id).classList.toggle('expanded');
    }

    // ============================================
    // Filtros
    // ============================================
    document.getElementById('filter-bar').addEventListener('click', e => {
      if (e.target.tagName !== 'BUTTON') return;
      document.querySelectorAll('#filter-bar button').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      filtroAtivo = e.target.dataset.filter;
      renderizar();
    });

    // ============================================
    // Ações rápidas
    // ============================================
    async function mudarStatus(id, novoStatus) {
      const { error } = await db.from('sugestoes').update({ status: novoStatus }).eq('id', id);
      if (error) return alert('Erro: ' + error.message);
      await carregar();
    }

    // ============================================
    // Modal de edição
    // ============================================
    function abrirEditor(id) {
      const s = cachesugestoes.find(x => x.id === id);
      if (!s) return;
      document.getElementById('edit-id').value = s.id;
      document.getElementById('edit-titulo').value = s.titulo_sugerido || '';
      document.getElementById('edit-tema').value = s.tema || '';
      document.getElementById('edit-status').value = s.status || 'gerada';
      document.getElementById('edit-data').value = s.data_publicacao_prevista || '';
      document.getElementById('edit-motivo').value = s.motivo || '';
      document.getElementById('edit-script').value = s.script || '';
      document.getElementById('modal').classList.add('show');
    }

    function fecharModal() {
      document.getElementById('modal').classList.remove('show');
    }

    async function salvarEdicao() {
      const id = document.getElementById('edit-id').value;
      const payload = {
        titulo_sugerido: document.getElementById('edit-titulo').value || null,
        tema: document.getElementById('edit-tema').value || null,
        status: document.getElementById('edit-status').value,
        data_publicacao_prevista: document.getElementById('edit-data').value || null,
        motivo: document.getElementById('edit-motivo').value || null,
        script: document.getElementById('edit-script').value || null,
      };
      const { error } = await db.from('sugestoes').update(payload).eq('id', id);
      if (error) return alert('Erro: ' + error.message);
      fecharModal();
      await carregar();
    }

    // ============================================
    // Gerar script — placeholder (Parte B implementa chamada ao Claude)
    // ============================================
    async function gerarScript(id) {
      alert('Geração de script via Claude ainda não implementada. Vem na Parte B desta tela.');
    }

    // Fechar modal ao clicar fora
    document.getElementById('modal').addEventListener('click', e => {
      if (e.target.id === 'modal') fecharModal();
    });

    // Boot
    carregar();
  </script>
</body>
</html>
